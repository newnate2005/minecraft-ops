apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-health-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  minecraft-health.json: |
    {
      "title": "Minecraft Server Health",
      "uid": "minecraft-health",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["minecraft"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Server Status",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "minecraft_status_healthy{server_host=\"localhost\"}", "legendFormat": "Status" }],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          }
        },
        {
          "id": 2,
          "title": "Players Online",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "minecraft_status_players_online_count{server_host=\"localhost\"}", "legendFormat": "Players" }],
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 3,
          "title": "Pod Restarts (1h)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"default\",container=\"minecraft\"}[1h])", "legendFormat": "Restarts" }],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 }] }
            }
          }
        },
        {
          "id": 4,
          "title": "Pod Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "kube_pod_status_ready{namespace=\"default\",pod=~\"minecraft-.*\",condition=\"true\"}", "legendFormat": "Ready" }],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "text": "NOT READY", "color": "red" }, "1": { "text": "READY", "color": "green" } } }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          }
        },
        {
          "id": 5,
          "title": "Node CPU Usage %",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }] } } }
        },
        {
          "id": 6,
          "title": "Node Memory Usage %",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100", "legendFormat": "Memory %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 90 }] } } }
        },
        {
          "id": 7,
          "title": "Node Disk Usage %",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "(1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"}) * 100", "legendFormat": "Disk %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 80 }] } } }
        },
        {
          "id": 8,
          "title": "Minecraft Container Memory",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "container_memory_working_set_bytes{namespace=\"default\",container=\"minecraft\"}", "legendFormat": "Working Set" }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 9,
          "title": "Players Online (History)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "expr": "minecraft_status_players_online_count{server_host=\"localhost\"}", "legendFormat": "Players" }],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 } }
        }
      ]
    }